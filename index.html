<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ポケモン図鑑番号チャレンジ</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Yu Gothic", Meiryo, sans-serif; color: #172239; background: #eef3fb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 16px; }
    main { max-width: 720px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 5vw, 2.5rem); }
    h2 { margin: 0 0 16px; font-size: 1.25rem; }
    .sub { color: #516178; margin: 0 0 24px; }
    .panel { background: white; border-radius: 20px; padding: 26px; box-shadow: 0 12px 38px #17325812; margin-bottom: 16px; }
    label { font-weight: 650; display: block; margin: 18px 0 7px; }
    input[type="number"], input[type="file"], select { width: 100%; max-width: 100%; padding: 12px; border: 1px solid #b7c5d8; border-radius: 10px; font: inherit; background: white; }
    input[type="number"]:focus, select:focus { outline: 3px solid #6b9aff77; }
    button { border: 0; background: #2463e8; color: #fff; padding: 13px 23px; font: inherit; font-weight: 700; border-radius: 12px; cursor: pointer; }
    button:hover:not(:disabled) { background: #164ac2; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .secondary { background: #e7eefc; color: #1847a6; }
    .secondary:hover:not(:disabled) { background: #d6e3ff; }
    .wide { width: 100%; margin-top: 16px; }
    .hidden { display: none; }
    .muted, .note { color: #5c6a7d; font-size: .9rem; }
    .note { margin-bottom: 0; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 26px; }
    .stat { background: #f0f5ff; border-radius: 14px; padding: 12px; text-align: center; }
    .stat strong { display: block; font-size: clamp(1.15rem, 4vw, 1.8rem); color: #1a50ba; }
    .stat span { font-size: .8rem; }
    .question-label { text-align: center; color: #5f6d80; }
    .pokemon { text-align: center; margin: 10px 0 25px; font-size: clamp(2rem, 9vw, 3.5rem); font-weight: 800; }
    .answer-line { display: flex; gap: 10px; }
    .answer-line input { flex: 1; min-width: 0; }
    .answer-line button { flex-shrink: 0; }
    .feedback { padding: 16px; margin-top: 18px; border-radius: 12px; background: #f1f5fb; line-height: 1.9; }
    .feedback.good { background: #e3f7eb; }
    .feedback.bad { background: #fff0e7; }
    .result-points { font-size: 3rem; font-weight: 800; margin: 4px 0 20px; color: #164dc5; }
    .result-points.negative { color: #bb2d32; }
    .row { display: flex; justify-content: space-between; gap: 14px; border-bottom: 1px solid #e7edf6; padding: 12px 0; }
    .error { color: #b42b31; font-weight: 600; }
    .history { padding-left: 22px; line-height: 1.9; }
    @media (max-width: 480px) { .panel { padding: 20px 16px; } .answer-line { flex-direction: column; } }
  </style>
</head>
<body>
<main>
  <h1>ポケモン図鑑番号チャレンジ</h1>
  <p class="sub">名前を見て、全国図鑑番号を当てよう。誤差の絶対値だけ1000ptから減点！</p>

  <section id="setup" class="panel">
    <h2>ゲーム設定</h2>
    <label for="mode">モード</label>
    <select id="mode">
      <option value="fixed">規定問題数モード（残りポイントを競う）</option>
      <option value="endless">サバイバルモード（何問続くかを競う）</option>
    </select>
    <div id="countRow">
      <label for="questionCount">問題数</label>
      <input id="questionCount" type="number" min="1" max="50" value="10" step="1" />
    </div>
    <p id="dataStatus" class="muted" aria-live="polite"></p>
    <p id="setupError" class="error" role="alert"></p>
    <button id="startButton" class="wide">ゲーム開始</button>
  </section>

  <section id="play" class="panel hidden">
    <div class="stats">
      <div class="stat"><strong id="points">1000</strong><span>残りpt</span></div>
      <div class="stat"><strong id="progress">1 / 10</strong><span>現在の問題</span></div>
      <div class="stat"><strong id="answered">0</strong><span>回答済み</span></div>
    </div>
    <div class="question-label">このポケモンの全国図鑑番号は？</div>
    <div class="pokemon" id="pokemonName"></div>
    <form id="answerForm">
      <label for="answer">図鑑番号を入力</label>
      <div class="answer-line">
        <input id="answer" type="number" min="1" step="1" inputmode="numeric" placeholder="例：25" required autocomplete="off" />
        <button type="submit" id="submitButton">回答する</button>
      </div>
    </form>
    <div id="feedback" class="feedback hidden" aria-live="polite"></div>
    <button id="nextButton" class="wide hidden">次の問題へ</button>
  </section>

  <section id="result" class="panel hidden">
    <h2 id="resultTitle">結果発表</h2>
    <div id="resultPoints" class="result-points"></div>
    <div id="resultStats"></div>
    <h3>直近の回答</h3>
    <ol id="history" class="history"></ol>
    <p id="bestResult"></p>
    <button id="restartButton" class="wide">設定画面へ戻る</button>
  </section>
</main>

  const $ = id => document.getElementById(id);
  const state = {
    pokemon: DEFAULT_POKEMON,
    mode: "fixed", limit: 10, points: 1000,
    deck: [], index: 0, current: null,
    history: [], finished: false
  };

  function show(id) {
    for (const section of ["setup", "play", "result"])
      $(section).classList.toggle("hidden", section !== id);
  }

  function shuffle(items) {
    const result = [...items];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function refillDeck() {
    state.deck = shuffle(state.pokemon);
    state.index = 0;
    // 周回の境目でも、直前と同じポケモンにならないようにする
    const previous = state.history.at(-1)?.number;
    if (state.deck.length > 1 && state.deck[0].number === previous) {
      [state.deck[0], state.deck[1]] = [state.deck[1], state.deck[0]];
    }
  }

  function updateDataStatus() {
    $("dataStatus").textContent = `出題対象：${state.pokemon.length}匹`;
    $("questionCount").max = state.pokemon.length;
    if (Number($("questionCount").value) > state.pokemon.length) {
      $("questionCount").value = state.pokemon.length;
    }
  }

  $("mode").addEventListener("change", () => {
    $("countRow").classList.toggle("hidden", $("mode").value === "endless");
  });

  $("startButton").addEventListener("click", () => {
    const mode = $("mode").value;
    const limit = Number($("questionCount").value);
    $("setupError").textContent = "";
    if (mode === "fixed" && (!Number.isInteger(limit) || limit < 1 || limit > state.pokemon.length)) {
      $("setupError").textContent = `問題数は1〜${state.pokemon.length}の整数を指定してください。`;
      return;
    }
    state.mode = mode;
    state.limit = limit;
    state.points = 1000;
    state.history = [];
    state.finished = false;
    refillDeck();
    show("play");
    nextQuestion();
  });

  function updateStats() {
    $("points").textContent = state.points;
    const current = state.history.length + 1;
    $("progress").textContent = state.mode === "fixed" ? `${current} / ${state.limit}` : `${current} 問目`;
    $("answered").textContent = state.history.length;
  }

  function nextQuestion() {
    if (state.index >= state.deck.length) refillDeck();
    state.current = state.deck[state.index++];
    $("pokemonName").textContent = state.current.name;
    $("answer").value = "";
    $("answer").disabled = false;
    $("submitButton").disabled = false;
    $("feedback").classList.add("hidden");
    $("nextButton").classList.add("hidden");
    updateStats();
    $("answer").focus();
  }

  $("answerForm").addEventListener("submit", event => {
    event.preventDefault();
    if (!state.current || state.finished || $("submitButton").disabled) return;
    const raw = $("answer").value;
    const guess = Number(raw);
    if (!/^\d+$/.test(raw) || !Number.isSafeInteger(guess) || guess < 1) {
      $("answer").setCustomValidity("1以上の整数を入力してください。");
      $("answer").reportValidity();
      return;
    }
    $("answer").setCustomValidity("");
    const pokemon = state.current;
    const penalty = Math.abs(pokemon.number - guess);
    state.points -= penalty;
    state.history.push({ number: pokemon.number, name: pokemon.name, guess, penalty });
    $("answer").disabled = true;
    $("submitButton").disabled = true;
    updateStats();

    const exact = penalty === 0;
    $("feedback").className = `feedback ${exact ? "good" : "bad"}`;
    $("feedback").replaceChildren();
    for (const message of [
      exact ? "正解！" : "惜しい！",
      `正解：No.${pokemon.number}（${pokemon.name}）`,
      `あなたの回答：No.${guess} / 減点：${penalty}pt`,
      `残り：${state.points}pt`
    ]) {
      const line = document.createElement("div");
      line.textContent = message;
      $("feedback").append(line);
    }
    $("feedback").classList.remove("hidden");
    if (state.points < 0 || (state.mode === "fixed" && state.history.length >= state.limit)) {
      state.finished = true;
      $("nextButton").textContent = "結果を見る";
    } else {
      $("nextButton").textContent = "次の問題へ";
    }
    $("nextButton").classList.remove("hidden");
    $("nextButton").focus();
  });

  $("nextButton").addEventListener("click", () => {
    if (state.finished) showResult();
    else nextQuestion();
  });

  function addRow(parent, label, value) {
    const div = document.createElement("div");
    div.className = "row";
    const left = document.createElement("span");
    const right = document.createElement("strong");
    left.textContent = label;
    right.textContent = value;
    div.append(left, right);
    parent.append(div);
  }

  function showResult() {
    show("result");
    const gameOver = state.points < 0;
    $("resultTitle").textContent = gameOver ? "ゲームオーバー" : "クリア！";
    $("resultPoints").textContent = `${state.points} pt`;
    $("resultPoints").className = `result-points ${gameOver ? "negative" : ""}`;
    const stats = $("resultStats"); stats.replaceChildren();
    addRow(stats, "モード", state.mode === "fixed" ? `規定問題数（${state.limit}問）` : "サバイバル");
    addRow(stats, "回答数", `${state.history.length}問`);
    addRow(stats, "完全正解", `${state.history.filter(x => x.penalty === 0).length}問`);
    addRow(stats, "減点合計", `${1000 - state.points}pt`);
    const history = $("history"); history.replaceChildren();
    for (const item of state.history.slice(-10)) {
      const li = document.createElement("li");
      li.textContent = `${item.name}：回答 ${item.guess} / 正解 ${item.number} / −${item.penalty}pt`;
      history.append(li);
    }
    // サバイバルは「0pt未満になった問題」も回答数に含む。
    // 参考として生存回答数も示す。
    if (state.mode === "endless") {
      addRow(stats, "0pt以上を維持した問題数", `${gameOver ? state.history.length - 1 : state.history.length}問`);
    }
    const key = `pokemon-quiz-best-v1:${state.mode}:${state.mode === "fixed" ? state.limit : "all"}`;
    try {
      const metric = state.mode === "fixed" ? (gameOver ? -Infinity : state.points) : Math.max(0, state.history.length - (gameOver ? 1 : 0));
      const previous = Number(localStorage.getItem(key));
      const hasPrevious = localStorage.getItem(key) !== null;
      const best = !hasPrevious || metric > previous ? metric : previous;
      if (Number.isFinite(best)) localStorage.setItem(key, String(best));
      $("bestResult").textContent = `このブラウザのベスト：${best === -Infinity ? "未クリア" : `${best}${state.mode === "fixed" ? "pt" : "問"}`}`;
    } catch { $("bestResult").textContent = ""; }
  }

  $("restartButton").addEventListener("click", () => show("setup"));
  $("answer").addEventListener("input", () => $("answer").setCustomValidity(""));
  updateDataStatus();
</script>
